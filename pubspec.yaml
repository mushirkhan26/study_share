name: study_share
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^8.0.2
  firebase_core: ^4.6.0
  logger: ^2.7.0
  flutter_secure_storage: ^10.0.0
  http: ^1.6.0
  intl: ^0.20.2
  go_router: ^17.1.0
  video_player: ^2.11.1
  curved_labeled_gradient_navigation_bar: ^2.0.13
  file_picker: ^10.3.10
  flutter_launcher_icons: ^0.14.4
  image_picker: ^1.0.7
  socket_io_client: ^3.1.4
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  sqflite: ^2.4.2+1

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  color_dark: "#FFFFFF"
  image_dark: assets/images/logo.png
  android: true
  ios: true
  android_gravity: center
  fullscreen: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_foreground_inset: 24
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
